[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "change-impact-investigator"
version = "0.1.0"
description = "Evidence-backed Python change impact investigation for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "kvianAR"}]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
dev = ["pytest>=8"]

[project.scripts]
change-impact = "change_impact.cli:main"
change-impact-mcp = "change_impact.server:main"

[tool.setuptools.packages.find]
where = ["src"]
