[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "change-impact-investigator"
version = "0.2.0"
description = "Evidence-backed Python and TypeScript change impact investigation for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "kvianAR"}]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
panel = ["keyring>=25,<27"]
dev = ["pytest>=8", "ruff>=0.9"]
demo = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "flask>=3.1,<4", "django>=5.2,<7"]

[project.scripts]
change-impact = "change_impact.cli:main"
change-impact-mcp = "change_impact.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
change_impact = ["*.cjs"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
    { file = "src/**/*.cjs" },
    { file = "README.md" },
    { file = "LICENSE" },
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/test_mcp.py" = ["E402"]
"examples/shop/test_shop.py" = ["E402"]
