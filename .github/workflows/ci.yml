name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,mcp,demo]'
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: change-impact --help
      - run: python -m change_impact --help
      - run: python scripts/run_demo.py --directory "$RUNNER_TEMP/change-impact-demo"
